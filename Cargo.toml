[package]
name = "rbirds"
version = "0.1.1"
edition = "2024"
rust-version = "1.96"
authors = ["Brandon Williams"]
description = "A Rust port of cbirds 1.4.0: a flock of birds in your terminal"
license = "MIT"
repository = "https://github.com/willibrandon/rbirds"
readme = "README.md"
keywords = ["boids", "flocking", "terminal", "animation", "braille"]
categories = ["command-line-utilities", "simulation"]
# Only the application sources ship; the reference, fixtures and tools do not.
include = ["/src/**", "/assets/sprite.png", "/Cargo.toml", "/Cargo.lock", "/LICENSE", "/NOTICE.md", "/README.md"]

# Rust's standard library and system libraries only: no dependency tables of
# any kind (docs/DESIGN.md §2). tools/verify.sh audits the resolved graph.

[lib]
name = "rbirds"
path = "src/lib.rs"

[[bin]]
name = "rbirds"
path = "src/main.rs"

[profile.dev]
# Overflow checks and debug assertions stay on: they are what running the
# suite in this profile is for (docs/PORTING.md §4.A). A little optimization
# takes the unoptimized sprite pipeline from 9 s to 0.6 s at startup, which
# keeps the translated statistical tests and live PTY timing tractable.
# Results cannot change: every contraction and fused sine is explicit.
opt-level = 1

[profile.release]
# Keep unwinding: terminal restoration after a controlled panic is tested.
panic = "unwind"
