# Runs when a version tag is pushed. The tag has to match Cargo.toml and the
# tagged commit has to have passed ci.yml. Builds the six targets, attaches
# them to a GitHub release with the tag's message as the notes, then publishes
# the crate.
#
# crates.io only accepts trusted publishing for a crate that already exists.
# For the first version, put a publish-new token in the crates-io environment
# as CRATES_IO_BOOTSTRAP_TOKEN, then add this workflow as the crate's trusted
# publisher and delete the secret.
name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME, Cargo.toml $version"
            exit 1
          fi
      - name: ci passed on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          passed=$(gh run list -R "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)
          if [ "$passed" -eq 0 ]; then
            echo "no successful ci run for $GITHUB_SHA"
            exit 1
          fi

  build:
    needs: check
    strategy:
      matrix:
        include:
          # 22.04 so the binaries run on glibc 2.35 and newer.
          - { target: x86_64-unknown-linux-gnu, os: ubuntu-22.04 }
          - { target: aarch64-unknown-linux-gnu, os: ubuntu-22.04-arm }
          - { target: x86_64-apple-darwin, os: macos-15-intel }
          - { target: aarch64-apple-darwin, os: macos-15 }
          - { target: x86_64-pc-windows-msvc, os: windows-2025 }
          - { target: aarch64-pc-windows-msvc, os: windows-11-arm }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      MACOSX_DEPLOYMENT_TARGET: '11.0'
      # No VCRUNTIME140.dll needed on the user's machine.
      RUSTFLAGS: ${{ contains(matrix.target, 'windows') && '-C target-feature=+crt-static' || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: The runner builds the target named
        run: |
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.target }}"
      - name: Build
        run: cargo build --release --locked
      - name: Run it
        run: |
          ./target/release/rbirds --version
          ./target/release/rbirds --record smoke.gif --record-seconds 1 --seed 1
          test -s smoke.gif
      - name: Package
        run: |
          name="rbirds-${GITHUB_REF_NAME#v}-${{ matrix.target }}"
          mkdir -p "dist/$name"
          cp LICENSE NOTICE.md README.md "dist/$name/"
          if [ "$RUNNER_OS" = Windows ]; then
            cp target/release/rbirds.exe "dist/$name/"
            (cd dist && 7z a -tzip "$name.zip" "$name" > /dev/null)
          else
            cp target/release/rbirds "dist/$name/"
            mkdir "dist/$name/completions"
            ./target/release/rbirds --completion bash > "dist/$name/completions/rbirds.bash"
            ./target/release/rbirds --completion zsh > "dist/$name/completions/_rbirds"
            ./target/release/rbirds --completion fish > "dist/$name/completions/rbirds.fish"
            tar -C dist -czf "dist/$name.tar.gz" "$name"
          fi
          rm -r "dist/$name"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  github-release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The annotated tag, for the notes
        # checkout leaves a lightweight tag in its place.
        run: git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum -- * > SHA256SUMS && cat SHA256SUMS
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/*
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --verify-tag --notes-from-tag \
            --title "rbirds ${GITHUB_REF_NAME#v}"

  crates-io:
    needs: github-release
    runs-on: ubuntu-24.04
    environment:
      name: crates-io
      url: https://crates.io/crates/rbirds
    permissions:
      contents: read
      id-token: write
    env:
      CRATES_IO_BOOTSTRAP_TOKEN: ${{ secrets.CRATES_IO_BOOTSTRAP_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Toolchain (pinned by rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - name: Trusted publishing token
        if: env.CRATES_IO_BOOTSTRAP_TOKEN == ''
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ env.CRATES_IO_BOOTSTRAP_TOKEN || steps.auth.outputs.token }}
