# Daily: when cbirds' main branch has a commit rbirds does not follow, run the
# comparison suite against it and open an issue listing what fails.
name: upstream

on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  UPSTREAM: https://github.com/clainstone/cbirds

jobs:
  check:
    runs-on: ubuntu-24.04
    permissions:
      issues: read
    outputs:
      commit: ${{ steps.main.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - id: main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin=$(sed -n 's/^ *"commit": "\([0-9a-f]\{40\}\)".*/\1/p' docs/reference-manifest.json | head -n 1)
          commit=$(git ls-remote "$UPSTREAM.git" HEAD | cut -f1)
          echo "rbirds follows $pin, cbirds main is at $commit"
          [ "$commit" != "$pin" ] || exit 0
          if gh issue list --state all --limit 1000 --json body --jq '.[].body' | grep -q "$commit"; then
            echo "already reported"
            exit 0
          fi
          echo "commit=$commit" >> "$GITHUB_OUTPUT"

  suite:
    needs: check
    if: needs.check.outputs.commit != ''
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    env:
      COMMIT: ${{ needs.check.outputs.commit }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup show active-toolchain || rustup toolchain install
      - name: Comparison suite against cbirds main
        run: |
          git clone -q "$UPSTREAM.git" "$RUNNER_TEMP/cbirds"
          git -C "$RUNNER_TEMP/cbirds" checkout -q --detach "$COMMIT"
          RBIRDS_REFERENCE="$RUNNER_TEMP/cbirds" RBIRDS_REFERENCE_COMMIT="$COMMIT" \
            cargo test --release --all-targets --locked --offline --no-fail-fast 2>&1 | tee suite.log
          awk '/^ *Running / { file = $0; sub(/^ *Running (unittests )?/, "", file); sub(/ .*/, "", file) }
               /^test .* \.\.\. FAILED$/ { print file "::" $2 }' suite.log > failures.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: failures-${{ matrix.os }}
          path: failures.txt

  report:
    needs: [check, suite]
    if: always() && needs.check.outputs.commit != ''
    runs-on: ubuntu-24.04
    permissions:
      issues: write
    env:
      COMMIT: ${{ needs.check.outputs.commit }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: results
      - run: |
          pin=$(sed -n 's/^ *"commit": "\([0-9a-f]\{40\}\)".*/\1/p' docs/reference-manifest.json | head -n 1)
          git clone -q --bare "$UPSTREAM.git" cbirds.git
          {
            echo "cbirds main is at $COMMIT. rbirds follows $pin. [All changes]($UPSTREAM/compare/$pin...$COMMIT)"
            echo
            echo "### Commits"
            echo
            git -C cbirds.git log --reverse --format="- [\`%h\`]($UPSTREAM/commit/%H) %s" "$pin..$COMMIT"
            echo
            echo "### Changed files"
            echo
            git -C cbirds.git diff --numstat "$pin" "$COMMIT" |
              awk -F '\t' '{ print "- [ ] `" $3 "` (+" $1 " -" $2 ")" }'
            echo
            echo "### Comparison suite"
            echo
            for os in ubuntu-24.04 ubuntu-24.04-arm macos-15 macos-15-intel; do
              f=results/failures-$os/failures.txt
              if [ ! -f "$f" ]; then echo "- $os: no result, the job did not finish"
              elif [ ! -s "$f" ]; then echo "- $os: all passed"
              else echo "- $os: $(wc -l < "$f") failed"; fi
            done
            echo
            for os in ubuntu-24.04 ubuntu-24.04-arm macos-15 macos-15-intel; do
              f=results/failures-$os/failures.txt
              [ ! -f "$f" ] || sed "s/\$/	$os/" "$f"
            done | sort | awk -F '\t' '
              $1 != test { if (test != "") print "- [ ] `" test "` (" on ")"; test = $1; on = $2; next }
              { on = on ", " $2 }
              END { if (test != "") print "- [ ] `" test "` (" on ")" }'
            echo
            echo "Logs: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > body.md
          gh issue create --title "Port cbirds main at ${COMMIT:0:7}" --body-file body.md
